services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
  backend:
    build: ./backend
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://flowforge:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/flowforge
      CORS_ORIGINS: http://localhost:5173
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
networks:
  internal:
    driver: bridge
